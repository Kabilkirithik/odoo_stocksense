# Test database configuration (Isolated H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=StockSenseProductionSecureSecretKeyMinimum256BitsLongForHmacSha256!
app.jwt.access-token-expiration-seconds=900
app.jwt.issuer=stocksense-auth-service
app.otp.validity-minutes=5
app.otp.max-attempts=3
app.otp.resend-cooldown-seconds=60
app.security.rate-limit.max-requests=100
app.security.rate-limit.window-seconds=60
app.inventory.dashboard-url=http://localhost:8000/dashboard
app.cors.allowed-origins=*
