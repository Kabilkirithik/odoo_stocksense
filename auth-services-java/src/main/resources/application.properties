# ===================================================================
# StockSense Authentication Service - Production Configuration
# ===================================================================
spring.application.name=stocksense-auth-service
server.port=${PORT:8081}

# -------------------------------------------------------------------
# PostgreSQL Database Configuration
# Externalized via environment variables (never hardcoded in source)
# Supports standard SPRING_DATASOURCE_* and shorthand DB_* variables
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/stocksense_db}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# HikariCP Enterprise Connection Pooling
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=StockSenseAuthHikariCP

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT Security Architecture (RFC 7519 Compliant HMAC-SHA256)
# -------------------------------------------------------------------
# Minimum 256-bit high-entropy secret key
app.jwt.secret=${JWT_SECRET:StockSenseProductionSecureSecretKeyMinimum256BitsLongForHmacSha256!}
# Stateless JWT token lifetime: 24 hours (86400 seconds)
app.jwt.access-token-expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.jwt.issuer=stocksense-auth-service

# -------------------------------------------------------------------
# OTP Password Reset Lifecycle
# -------------------------------------------------------------------
# OTP validity window: 5 minutes
app.otp.validity-minutes=5
# Max failed verification attempts before invalidating OTP
app.otp.max-attempts=3
# Cooldown period before allowing another OTP dispatch: 60 seconds
app.otp.resend-cooldown-seconds=60

# -------------------------------------------------------------------
# Brute-Force & Rate Limiting Defense
# -------------------------------------------------------------------
# Max 20 auth requests per 60 seconds per IP address
app.security.rate-limit.max-requests=20
app.security.rate-limit.window-seconds=60

# -------------------------------------------------------------------
# Inventory Dashboard & Python Backend Integration
# -------------------------------------------------------------------
# The URL where frontend should redirect the authenticated user
app.inventory.dashboard-url=${INVENTORY_DASHBOARD_URL:http://localhost:8000/dashboard}

# CORS Configuration: allow frontend dev servers (React/Vue/Vite/Next.js) & Python backend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8000,http://localhost:5000,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:8000}

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.example.stocksense=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
